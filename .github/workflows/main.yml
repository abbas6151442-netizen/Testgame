name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          mkdir -p Payload/Game.app
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 -parse-as-library -O Game.swift -o Payload/Game.app/Game
          cat > Payload/Game.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>Game</string>
          <key>CFBundleIdentifier</key><string>com.test.tinygame</string>
          <key>CFBundleName</key><string>Tiny Game</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>CFBundleSupportedPlatforms</key><array><string>iPhoneOS</string></array>
          <key>MinimumOSVersion</key><string>15.0</string>
          <key>LSRequiresIPhoneOS</key><true/>
          <key>UIDeviceFamily</key><array><integer>1</integer></array>
          <key>UILaunchScreen</key><dict/>
          <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          </dict></plist>
          EOF
          zip -qr Game.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Game
          path: Game.ipa
